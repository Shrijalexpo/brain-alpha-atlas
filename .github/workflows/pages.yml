name: Publish docs to GitHub Pages

# Automatically builds and deploys GitHub Pages on push to main or manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Markdown hygiene
        run: python3 Tools/documentation-validation/check_docs.py Docs README.md mkdocs.yml LICENSE NOTICE LICENSE-DOCS

      - name: Experiment index reconciliation
        run: python3 Tools/documentation-validation/verify_index.py

      - name: Install documentation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Build the wiki (strict)
        env:
          MKDOCS_SITE_URL: ${{ vars.MKDOCS_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MKDOCS_SITE_URL}" ]; then unset MKDOCS_SITE_URL; fi
          python3 -m mkdocs build --strict

      - name: Scan the built site for private material
        run: python3 Tools/documentation-validation/check_docs.py --text-scan site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

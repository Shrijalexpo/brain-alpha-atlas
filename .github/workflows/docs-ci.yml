name: Docs CI

# Runs on every pull request and on pushes to the primary branch. It is deliberately
# offline: no platform access, no credentials, no simulations, no network beyond installing
# the pinned documentation dependency from PyPI.
#
# Locally the same checks are one command each:
#   python3 Tools/check_docs.py --selftest && python3 Tools/brain_sweep_parser.py --selftest
#   python3 Tools/validate_spc_isin.py --selftest && python3 Tools/verify_index.py --selftest
#   python3 Tools/check_docs.py docs README.md mkdocs.yml LICENSE NOTICE LICENSE-DOCS
#   python3 Tools/verify_index.py
#   python3 -m mkdocs build --strict && python3 Tools/check_docs.py --text-scan site

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      # Pinned to major versions. Pin to a full commit SHA instead if this repository
      # later requires it; the actions used here are the two most common in the ecosystem.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tool self-tests
        run: |
          set -euo pipefail
          python3 Tools/brain_sweep_parser.py --selftest
          python3 Tools/validate_spc_isin.py --selftest
          python3 Tools/check_docs.py --selftest
          python3 Tools/verify_index.py --selftest

      - name: Markdown hygiene
        run: python3 Tools/check_docs.py docs README.md mkdocs.yml LICENSE NOTICE LICENSE-DOCS

      - name: Experiment index reconciliation
        run: python3 Tools/verify_index.py

      - name: Install documentation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Build the wiki (strict)
        run: python3 -m mkdocs build --strict

      - name: Scan the built site for private material
        run: python3 Tools/check_docs.py --text-scan site

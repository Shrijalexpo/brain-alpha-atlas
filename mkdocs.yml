# Documentation site configuration for BRAIN Alpha Atlas.
#
#   .venv-docs/bin/mkdocs serve            # local preview
#   .venv-docs/bin/mkdocs build --strict   # CI strict build

site_name: BRAIN Alpha Atlas
site_description: >-
  Progressive WorldQuant BRAIN consultant curriculum for new researchers and live simulation
  analytics, empirical lessons, and advanced engineering for expert consultants.

site_url: !ENV [MKDOCS_SITE_URL, "https://shrijalexpo.github.io/brain-alpha-atlas/"]

docs_dir: Docs
site_dir: site
use_directory_urls: true

theme:
  name: mkdocs

nav:
  - Home: index.md
  - New Consultant Track:
      - 01. Getting Started: 01-getting-started/index.md
      - 02. Financial & Quant Foundations: 02-financial-and-quantitative-foundations/index.md
      - 03. BRAIN Fundamentals & Settings: 03-worldquant-brain-fundamentals/index.md
      - 04. Data Explorer & Datasets:
          - Overview & Diagnostics: 04-data-explorer-and-datasets/index.md
          - Dataset & Field Catalog: 04-data-explorer-and-datasets/dataset-catalog-and-field-notes.md
      - 05. Fast Expression Language:
          - Syntax & Normalization: 05-fast-expression-language/index.md
          - Operator Reference: 05-fast-expression-language/operator-reference.md
      - 06. Alpha Research & Construction: 06-alpha-research-and-construction/index.md
      - 07. Simulation & Evaluation: 07-simulation-and-evaluation/index.md
      - 08. Submission & Eligibility: 08-submission-and-eligibility/index.md
  - Expert Track — Programs & Advanced:
      - 09. Power Pool & Competitions: 09-power-pool-and-thematic-competitions/index.md
      - 10. Pyramids & Genius Program: 10-pyramids-and-genius-program/index.md
      - 11. Osmosis & Compensation: 11-osmosis-and-compensation/index.md
      - 12. Advanced Alpha Research: 12-advanced-alpha-research/index.md
      - 13. Region-Agnostic & Cluster Alphas: 13-region-agnostic-and-cluster-alphas/index.md
      - 14. BRAIN API & Automation: 14-brain-api-and-automation/index.md
      - 15. Alpha Harness: 15-alpha-harness/index.md
      - 16. Quant Research Methodology: 16-quantitative-research-methodology/index.md
  - Live Simulation & Lessons Hub:
      - 17. Case Studies & 26 Lessons: 17-case-studies-and-lessons-learned/index.md
      - 18. Simulation Results & Sweep Hub:
          - Live Overview & Leaderboards: 18-simulation-results-and-sweep-analytics/index.md
          - USA 3,550-Block Factor Screening: 18-simulation-results-and-sweep-analytics/usa-3550-sweep-analysis.md
          - Full 71-Experiment & Sweep Ledger: 18-simulation-results-and-sweep-analytics/master-experiment-ledger.md
  - Reference:
      - Reference Overview: reference/index.md
      - Fast Expression Cheat Sheet: reference/fast-expression-cheatsheet.md
      - Troubleshooting & Errors: reference/troubleshooting-and-errors.md
      - Command & Workflow Playbook: reference/command-and-workflow-playbook.md
      - Sources & Evidence Policy: reference/sources-and-policy.md
      - Contributing: reference/contributing.md
      - Changelog: reference/changelog.md

markdown_extensions:
  - tables
  - fenced_code
  - sane_lists

validation:
  links:
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: ignore
    anchors: warn
